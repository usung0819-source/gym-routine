name: 운동 알림 보내기
on:
  schedule:
    - cron: "3-59/10 * * * *"   # 10분마다 (정각을 피해 3분, 13분, ...)
  workflow_dispatch: {}
concurrency:
  group: push-send
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/push/send.js
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
