<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헬스 주간 루틴</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5BFF">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="헬스 루틴">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* layout: 폰 한 화면 앱. 상단 고정(주차+요일 탭) / 본문 카드 목록 / 하단 탭바 + 휴식 타이머 */
:root{
  --bg:#F4F7FF; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6478; --line:#DCE3F1;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --accent-soft:#FFE7E0;
  --sel:#2F5BFF; --sel-ink:#FFFFFF;
  --good:#0E9F6E; --good-soft:#DCFAE9; --warn:#C26A00; --warn-soft:#FFF1D6; --bad:#E5383B; --bad-soft:#FFE3E3;
  --display:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#18233F; --ink:#F1F5FF; --muted:#9FAACC; --line:#2C3A60;
    --accent:#FF7A59; --accent-ink:#1E0A04; --accent-soft:#40231C;
    --sel:#7C9BFF; --sel-ink:#0E1630;
    --good:#3DDC97; --good-soft:#0F3A2B; --warn:#FFC152; --warn-soft:#3D2E10; --bad:#FF7B7B; --bad-soft:#3F1A1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#18233F; --ink:#F1F5FF; --muted:#9FAACC; --line:#2C3A60;
  --accent:#FF7A59; --accent-ink:#1E0A04; --accent-soft:#40231C;
  --sel:#7C9BFF; --sel-ink:#0E1630;
  --good:#3DDC97; --good-soft:#0F3A2B; --warn:#FFC152; --warn-soft:#3D2E10; --bad:#FF7B7B; --bad-soft:#3F1A1F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:12px}
.weekrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.weeknav .wk{font-family:var(--display);font-size:20px;min-width:72px;text-align:center}
.phase{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 10px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;font-size:13px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding-bottom:10px}
.day{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 8px;text-align:center;font-weight:800;font-size:15px}
.day small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.day[aria-selected="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.day[aria-selected="true"] small{color:inherit;opacity:.75}
.day .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good);display:none}
.day.done .dot{display:block}
.day.t-drink small{color:var(--warn);font-weight:800}
.day.t-rec small,.day.t-rest small,.day.t-opt small{opacity:.8}
.date{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600;vertical-align:4px}
.drinkbtn{width:100%;margin:12px 0 4px;min-height:44px;border-radius:12px;border:1px dashed var(--warn);background:transparent;color:var(--warn);font-weight:800;font-size:14px}
.drinkbtn[aria-pressed="true"]{border-style:solid;background:var(--warn-soft)}
.callout{margin-top:10px}
.callout.warn2{background:var(--bad-soft)}
.card.warnc{border-color:var(--warn)}
ul.tips{margin:0;padding-left:18px;font-size:14px}
ul.tips li{margin:3px 0}
.day.today::after{content:"오늘";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:6px;font-weight:600}

/* main */
main{padding:16px 0 150px}
.dayhead{display:grid;gap:4px;margin-bottom:14px}
.dayhead h2{font-family:var(--display);font-size:28px;font-weight:400}
.dayhead p{margin:0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.stat b{font-size:15px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:15px;font-weight:800;letter-spacing:.2px}
.sec span{font-size:13px;color:var(--muted)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.list>*{min-width:0}
.gstrip{display:flex;gap:8px;overflow-x:auto;max-width:100%;min-width:0;margin-top:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;max-width:100%}
.card.complete{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.exhead{display:flex;align-items:flex-start;gap:12px}
.ttl{flex:1;min-width:0}
.pic{flex:none;width:112px;height:78px;border-radius:10px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.pic svg{width:100%;height:100%;display:block}
.pic g polyline,.pic g circle{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pic .m polyline,.pic .m circle{stroke:var(--muted);stroke-width:3.5;opacity:.75}
.pic .p polyline{stroke:var(--accent);stroke-width:10}
.pic .hd{fill:var(--accent);stroke:none}
.pic.fig{padding:0;cursor:zoom-in;width:128px;height:90px;background:#F4F7FF}
.pic.fig svg{width:100%;height:100%;display:block}
.pic.sm{width:84px!important;height:59px!important}
.cue{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--bad);line-height:1.45}
.vid{font-size:13px;font-weight:800;color:var(--sel);text-decoration:underline}
.zoomov .zbig{width:100%;aspect-ratio:200/140;border-radius:12px;border:1px solid #DCE3F1;display:block;margin-bottom:8px}
.zoomov .zf svg{width:100%;aspect-ratio:200/140;border:1px solid #DCE3F1;border-radius:10px;display:block}
.zoomov ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#14213D}
.zoomov{overflow-y:auto}
.pic.aiv{background:#fff;position:relative}.tbadge{position:absolute;left:4px;top:4px;z-index:2;background:#D92D20;color:#fff;font-size:11px;font-weight:800;line-height:1.3;padding:1px 6px;border-radius:6px;pointer-events:none}.rfig.vid{position:relative}.pic.aiv video,.pic.aiv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.aivbig{width:100%;aspect-ratio:16/9;border-radius:12px;background:#fff;display:block;border:1px solid #DCE3F1}
.rfig.vid{aspect-ratio:16/9;background:#fff}.rfig.vid video{width:100%;height:100%;object-fit:cover;display:block}
.pic.real{background:#fff;padding:0;cursor:zoom-in;width:128px;height:90px}
.zoomov{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px}
.zoomov .zb{margin:auto 0}
.zoomov .zb{background:#fff;color:#14213D;border-radius:16px;max-width:560px;width:100%;padding:14px}
.zoomov .zf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zoomov .zf figure{margin:0;text-align:center;font-size:13px;font-weight:800}
.zoomov .zf img{width:100%;aspect-ratio:285/200;object-fit:contain;border:1px solid #DCE3F1;border-radius:10px}
#pvBox img{aspect-ratio:16/9;object-fit:cover;background:#fff}
@media (max-width:480px){.zoomov .zf{grid-template-columns:1fr}}
.pic.real img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.pic.real img.f2{animation:exfr 2.6s ease-in-out infinite}
@keyframes exfr{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pic.real img.f2{animation:none;opacity:0}}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.photo{font-size:13px;font-weight:600;color:var(--accent)}
@media (max-width:360px){.pic,.pic.real{width:96px;height:68px}}
.exhead h4{margin:0;font-size:17px;font-weight:800}
.meta{margin:2px 0 0;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.infobtn{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.infobtn[aria-expanded="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.set{min-width:64px;height:44px;border-radius:10px;border:2px dashed var(--line);background:transparent;font-weight:800}
.set[aria-pressed="true"]{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
.kg{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px;font-size:14px}
.kg label{display:flex;align-items:center;gap:6px;font-weight:600}
.kg input{width:84px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;text-align:right}
.kg .prev{color:var(--muted);font-size:13px}
.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.detail h5{margin:6px 0 2px;font-size:13px}
.detail ul{margin:0;padding-left:18px}
.detail .ng{color:var(--bad)}
.detail .alt{color:var(--good)}
.swap{display:inline-block;font-size:12px;font-weight:800;padding:0 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-right:4px}
table.gymt td{padding:8px 4px;vertical-align:middle}
.gb{text-align:right;white-space:nowrap}
.gb button{min-width:56px;height:36px;margin-left:6px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px}
.gb button[data-v="yes"][aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.gb button[data-v="no"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.detail .ng + ul{color:var(--ink)}
.simple{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.simple .txt{flex:1;min-width:120px}
.check{flex:none;width:44px;height:44px;border-radius:12px;border:2px dashed var(--line);background:transparent;font-size:20px;font-weight:800;color:var(--good)}
.check[aria-pressed="true"]{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.simple .txt{flex:1;min-width:0}
.callout{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent}
.callout b{color:var(--warn)}
.rest{text-align:center;padding:28px 16px}
.rest .big{font-family:var(--display);font-size:40px;color:var(--good)}

/* guide */
.g h2{font-family:var(--display);font-size:26px;font-weight:400;margin-bottom:6px}
.g .card{margin-bottom:10px}
.g h3{font-size:16px;margin-bottom:6px}
.g ul{margin:0;padding-left:18px}
.g li{margin:3px 0}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}

/* log */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.kgg{margin:8px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;font-size:14px;line-height:1.5}.kgg ol{margin:4px 0 0;padding-left:20px}.kgg summary{font-weight:800;cursor:pointer}.kgg .kggx{margin:8px 0 0;color:#5B6478}.kgg .kggx b{color:var(--ink)}.seg2{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}.seg2 button{min-width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800;font-size:14px;color:var(--ink)}.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.callout.kcn.ok{background:#EAF7EF;color:#14603A}
.msgov{align-items:center;z-index:40}.msgov .msgb{max-width:420px;max-height:calc(100vh - 32px);overflow-y:auto}.msgbtns{display:flex;gap:8px;justify-content:flex-end}.msgbtns .btn{min-width:96px}
.kcg{margin:-2px 0 14px}.kcg p{margin:6px 0}.kcgst{font-size:14px;line-height:1.5;padding:8px 10px;border-radius:10px;background:#EEF3FF;color:#1D3A8A}.kcgst.ok{background:#EAF7EF;color:#14603A}.kcgst.mid{background:#EEF3FF;color:#1D3A8A}.kcgst.bad{background:#FEECEB;color:#B42318}
.alrow{display:grid;grid-template-columns:22px minmax(0,1fr) 136px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line,#E6EAF2)}.alrow:last-child{border-bottom:0}.alt{font-size:13px;color:var(--sub,#5b6475);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alrow input[type=time]{width:136px;font-size:14px;padding:6px 4px}.alst{margin-top:12px}.alok{color:#14603A;font-weight:700;margin:0 0 8px}.almsg{margin:10px 0 0;font-size:14px;background:#EEF3FF;color:#1D3A8A;padding:8px 10px;border-radius:10px}
.ruler{width:100%;margin:10px 0 2px;accent-color:#2F5BFF;height:28px}.rulerlab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub,#5b6475);padding:0 4px}
.bwlist{list-style:none;margin:10px 0 0;padding:0}
.bwlist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bwlist button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.bwlist button.btn{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-size:14px;padding:0 14px;border-radius:10px;font-weight:800}
.bwlist button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.down{color:var(--good);font-weight:800}.up{color:var(--bad);font-weight:800}
svg.spark{width:100%;height:120px;display:block;margin-top:8px}

/* bottom */
.timer{position:fixed;left:0;right:0;bottom:64px;z-index:6;display:none}
.timer.on{display:block}
.timer .in{max-width:560px;margin:0 auto;padding:0 16px}
.timer .box{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:26px;min-width:70px}
.timer .lbl{flex:1;font-size:13px;opacity:.85}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.timer.end .box{background:var(--good);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:64px;border:0;background:none;font-weight:800;font-size:14px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
[hidden]{display:none!important}
.painseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.painseg button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.painseg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.painseg button.p6[aria-pressed="true"],.painseg button.p8[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.sug{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--good);font-weight:700}
.sug button{border:1px solid var(--good);background:var(--good-soft);color:var(--good);border-radius:8px;padding:3px 10px;font-weight:800;font-size:13px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.rbox .k{font-size:12px;color:var(--muted);font-weight:700}
.rbox .v{font-size:22px;font-weight:800;margin-top:2px}
.rbox .d{font-size:12px;margin-top:2px}
.up2{color:var(--good)}.dn2{color:var(--bad)}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.board li.me{background:var(--accent-soft);border-radius:10px}
.board .rk{font-size:18px;font-weight:800;text-align:center}
.board .nm{font-weight:800;min-width:0;overflow-wrap:anywhere}
.board .sc{text-align:right;font-size:13px}
.wkbars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:110px;margin-top:8px}
.wkbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.wkbars i{display:block;width:60%;background:var(--sel);border-radius:6px 6px 0 0;min-height:3px}
.wkbars .cur i{background:var(--accent)}
.stat.kc{border-color:var(--accent);background:var(--accent-soft)}
.card.bwq{margin:10px 0 0;border-color:var(--sel)}
.placeseg{display:grid;gap:6px;margin:8px 0 4px}
.placeseg>div{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.placeseg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.placeseg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
table.gymt th.gh{padding:14px 4px 4px;font-size:12px;color:var(--sel);font-weight:800;border-bottom:0}
main.wrap{padding:16px 16px calc(150px + env(safe-area-inset-bottom))}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;word-break:keep-all;overflow-wrap:break-word}
.brand,.brand2,.wk,.dayhead h2,.g h2,.ph,.rname,.rbig,.timer .t,.rest .big{font-weight:800;letter-spacing:-0.02em}

.homebtn[aria-pressed="true"]{border-style:solid;background:var(--sel);color:var(--sel-ink)}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.themes button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.themes button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}

.fs{border:0;margin:0;padding:0}

.opts{display:flex;flex-wrap:wrap;gap:8px}

.err{margin:0;color:var(--bad);font-weight:700;font-size:14px}

.startbtn.wide{width:100%;height:46px;border-radius:12px;font-size:15px}
.runov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}

.rname{font-family:var(--display);font-size:24px}
.rset{color:var(--muted);font-size:14px;font-weight:600}

.rlabel{font-size:22px;font-weight:800}

.rfig svg{width:100%;height:100%;display:block}
.rfig.real{background:#fff}

.rfig.two>svg,.rfig.two .inset svg{width:100%;aspect-ratio:200/140;height:auto;border-radius:12px;border:1px solid var(--line)}
.rfig.real img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}
.rmid.hasfig .rbig{font-size:76px}
.rmid.hasfig .rlabel{font-size:19px}
#rCue{margin:0;max-width:360px}
.rbig{font-family:var(--display);font-size:120px;line-height:1.05;color:var(--accent)}
.rbig.k-rest,.rbig.k-ready{color:var(--good)}
.rbig.k-hold{color:var(--warn)}
.rbig.k-done{color:var(--good)}
.rsub{color:var(--muted);font-size:15px;min-height:1.5em}
.rbarw{width:100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.rbarw i{display:block;height:100%;width:0;background:var(--accent)}
.rbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rbtns #rNextEx{grid-column:1/-1}
.ropts{display:flex;flex-wrap:wrap;gap:8px}
.ropts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px;font-size:13px;font-weight:600}
.rnote{margin:0;font-size:12px;color:var(--muted)}

  if(PRG&&PRG.light&&E.leg)return null;
  if(D&&D.pain>=6)return null;
  var h=kgHist(id,w,d);if(h.length<2)return null;
  var a=h[0],b=h[1];
  if(!(a.kg>0)||a.kg!==b.kg)return null;
  if(a.n<Math.min(phase(a.w).sets,2)||b.n<Math.min(phase(b.w).sets,2))return null;
  var step=(id==="curl"||id==="lateral")?1:2.5;
  return {from:a.kg,to:Math.round((a.kg+step)*10)/10};
}
function homeBtn(){

}

function dayProgress(w,d,item){
  if(!item||item.t!=="s")return {got:0,total:0};
  var D=sesOf(w,d,item),hx=D.homeEx||[],total=(D.ex.length+hx.length)*D.sets+1,got=0;
  D.ex.concat(hx).forEach(function(id){var a=setsOf(w,d,id);for(var i=0;i<D.sets;i++){if(a[i])got++;}});
  if(isDone(w,d,"cardio"))got++;
  return {got:got,total:total};
}
function minutes(w,D){var P=phase(w),st=D.sets||P.sets,wm=D.wmin||10;return wm*2+cminOf(D,P)+(D.xw||0)+Math.round(D.ex.length*st*2.2);}
function prevKg(id,w,d){
  var best=null,cur=w*10+ORDER.indexOf(d);
  Object.keys(S.kg).forEach(function(k){
    var p=k.split("|");if(p[2]!==id||!S.kg[k])return;
    var oi=ORDER.indexOf(p[1]);if(oi<0)oi=5;
    var v=(+p[0])*10+oi;
    if(v<cur&&(!best||v>best.v))best={v:v,kg:S.kg[k],w:+p[0],d:p[1]};
  });
  return best;
}
function tagOfD(it,d){if(it.t==="s"){var pl=placeOf(week,d);if(pl==="home")return "홈트";if(pl==="out")return "야외";}return tagOf(it);}
function tagOf(it){if(it.t==="s")return it.moved?"보충":SES[it.s].short;return{drink:"술약속",rec:"회복",opt:"선택",rest:"휴식"}[it.t];}

/* ---------- 칼로리 추정 (MET × 3.5 × 체중kg ÷ 200 × 분) ---------- */
function curKg(){var l=(S.bw||[]).filter(function(x){return x.kg>0;}).sort(function(a,b){return a.d<b.d?-1:1;});return l.length?l[l.length-1].kg:(PF&&PF.w)||70;}
function kcalOf(met,min){return met*3.5*curKg()/200*min;}
function runMet(kmh){var pts=[[6.4,6.0],[8.0,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8]];if(kmh<=pts[0][0])return pts[0][1];for(var i=1;i<pts.length;i++){if(kmh<=pts[i][0]){var a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*(kmh-a[0])/(b[0]-a[0]);}}return pts[pts.length-1][1];}
function cardioMet(c){
  if(c==="run"||c==="outrun"){var sp=PF&&PF.runKm>0&&PF.runMin>0?PF.runKm/(PF.runMin/60):8;return runMet(sp);}
  return {treadmill:5.0,outwalk:4.3,bike:4.0,elliptical:5.0,march:3.5}[c]||4.0;
}
function cardioKcal(D,min){
  var x=D.xw?kcalOf(cardioMet(D.xwk||"treadmill"),D.xw):0;
  if((D.c==="run"||D.c==="outrun")&&min>10)return kcalOf(3.5,10)+kcalOf(cardioMet(D.c),min-10)+x;
  return kcalOf(cardioMet(D.c),min)+x;
}
function dayKcal(w,d,it){
  var D=sesOf(w,d,it),P=phase(w),cmin=cminOf(D,P),strMin=D.ex.length*D.sets*2.2,wm=D.wmin;
  var plan=kcalOf(3.0,wm)+kcalOf(3.5,strMin)+cardioKcal(D,cmin)+kcalOf(2.5,wm);
  var got=0,tot=D.ex.length*D.sets;D.ex.forEach(function(id){var a=setsOf(w,d,id);for(var i=0;i<D.sets;i++)if(a[i])got++;});
  var done=(isDone(w,d,"warm")?kcalOf(3.0,wm):0)+(tot?kcalOf(3.5,strMin)*got/tot:0)+(isDone(w,d,"cardio")?cardioKcal(D,cmin):0)+(isDone(w,d,"stretch")?kcalOf(2.5,wm):0);
  return {plan:Math.round(plan),done:Math.round(done)};
}
function weekKcal(w){var PL=plan(w),s=0;ORDER.forEach(function(d){var it=PL[d];if(it.t==="s")s+=dayKcal(w,d,it).done;});return s;}
function kcGoal(){var p=S.pf;return p&&p.kcT>0&&(p.kcU==="day"||p.kcU==="week")?{u:p.kcU,t:p.kcT}:null;}
function weekPlanKcal(w){var PL=plan(w),s=0,n=0;ORDER.forEach(function(d){var it=PL[d];if(it.t==="s"){s+=dayKcal(w,d,it).plan;n++;}});return {plan:s,n:n};}
/* 칼로리 목표 안내: 모자란 만큼은 충격이 적은 유산소 시간으로만, 정한 운동 시간 안에서만 안내한다(루틴은 자동으로 바꾸지 않음). */
function kcNote(w,d,it,D){
  var g=kcGoal();if(!g||D.kcTgt==null)return "";
  var k=dayKcal(w,d,it),lead=(g.u==="day"?"하루 목표 ":"주간 목표(운동하는 날 평균) ")+"약 <b>"+D.kcTgt.toLocaleString()+"kcal</b>";
  var nm=function(c){return (CARDIO[c]&&CARDIO[c].name||"유산소").replace(/ \(.*\)$/,"");};
  var h='<div class="callout kcn'+(k.plan>=D.kcTgt?" ok":"")+'">칼로리 목표 반영: '+lead+'. ';
  if(D.kcAdd){var n1=nm(D.c),cc=n1.charCodeAt(n1.length-1)-0xAC00;h+='<b>'+esc(n1)+'</b>'+(cc>=0&&cc<11172&&cc%28?"을":"를")+' <b>'+D.kcAdd+'분</b> 늘렸습니다. ';}
  if(D.xw)h+='러닝은 평소대로 두고, 끝난 뒤 <b>'+esc(D.xwk==="outwalk"?"빠르게 걷기":D.xwk==="bike"?"실내자전거":"경사 걷기")+' '+D.xw+'분</b>을 더했습니다. ';
  h+='오늘 계획 약 <b>'+k.plan.toLocaleString()+'kcal</b>.';
  if(k.plan<D.kcTgt){
    if(D.pain>=6)h+=' 통증 기록이 있어 오늘은 늘리지 않았습니다.';
    else if(D.kcCut==="time"||(!D.kcAdd&&!D.xw))h+=' 정한 운동 시간('+D.fitT+'분)이 차서 더 늘리지 않았습니다. 목표를 낮추거나 내 정보에서 운동 시간을 늘리세요.';
    else if(D.kcCut==="cap")h+=' 유산소가 너무 길어지지 않게 '+(D.xw?"추가 걷기는 30분":"유산소는 60분")+'까지만 늘렸습니다.';
  }
  return h+' <span class="meta">근력 운동은 그대로입니다. 칼로리는 어림값입니다.</span></div>';
}

function renderTop(){

  document.getElementById("wkLabel").textContent=week+"주차";
  document.getElementById("phase").innerHTML='<span class="chip">'+P.name+'</span><span class="num">이번 주 운동 <b>'+done+"/"+planned+'</b> 완료 · 약 <b>'+weekKcal(week).toLocaleString()+'</b>'+(kcGoal()&&kcGoal().u==="week"?' / 목표 '+kcGoal().t.toLocaleString():"")+'kcal</span>'+(week!==cw?'<button class="linkbtn" id="goNow">이번 주('+cw+'주차)로</button>':"");
  var g=document.getElementById("goNow");if(g)g.onclick=function(){week=cw;dayK=todayKey;renderAll();};
  var html="";
  ORDER.forEach(function(d){
    var it=PL[d],pr=dayProgress(week,d,it),fin=it.t==="s"&&pr.got===pr.total;
    var isToday=(week===cw&&d===todayKey);
    html+='<button class="day t-'+it.t+(fin?" done":"")+(isToday?" today":"")+'" role="tab" aria-selected="'+(d===dayK)+'" data-d="'+d+'"><span class="dot"></span>'+LABEL[d]+'<small>'+tagOfD(it,d)+'</small></button>';
  });
  var el=document.getElementById("days");el.innerHTML=html;
  el.querySelectorAll(".day").forEach(function(b){b.onclick=function(){dayK=b.dataset.d;view="day";renderAll();window.scrollTo(0,0);};});
}

function simpleCard(id,title,sub,how,ng,picId){
  var on=isDone(week,dayK,id);
  return '<div class="card'+(on?" complete":"")+'">'+(picId?'<div class="exhead">'+pic(picId)+'<div class="ttl"><h4>'+esc(title)+'</h4><p class="meta">'+sub+'</p></div></div>':"")+'<div class="simple"'+(picId?' style="margin-top:12px"':"")+'><button class="check" data-done="'+id+'" aria-pressed="'+on+'" aria-label="'+esc(title)+' 완료">'+(on?"✓":"")+'</button><div class="txt">'+(picId?'<p class="meta">다 했으면 체크</p>':'<h4 style="margin:0;font-size:16px">'+esc(title)+'</h4><p class="meta">'+sub+'</p>')+'</div><div class="acts">'+((id==="warm"||id==="stretch")?'<button class="startbtn" data-gstart="'+id+'">▶ 시작</button>':"")+'<button class="infobtn" data-info="'+id+'" aria-expanded="false">방법</button>'+(picId?photo(picId):"")+'</div></div>'+((id==="warm"||id==="stretch")?guideThumbs(id):"")+detail(id,how,ng,picId)+'</div>';

var GNAME={shoulderroll:"어깨 작게 돌리기",catcow:"네발 자세 허리 둥글게·평평하게",hipcircle:"엉덩이 돌리기",hamstring:"누워서 허벅지 뒤 늘리기",hipflexor:"무릎 꿇고 허벅지 앞 늘리기",cheststretch:"벽에 팔 대고 가슴 늘리기",calfstretch:"벽 짚고 종아리 늘리기"};
var GCUE={shoulderroll:"크게 돌리지 않습니다. 아프지 않은 범위에서 작게.",catcow:"허리를 아래로 꺾지 않습니다. 둥글게 올렸다가 평평한 자세까지만.",hipcircle:"허리를 뒤로 젖히지 말고 천천히 작게 돕니다.",hamstring:"무릎을 억지로 펴지 말고, 허리가 바닥에서 뜨지 않게 합니다. 반동 금지.",hipflexor:"허리를 뒤로 꺾지 말고 골반만 앞으로 밉니다.",cheststretch:"팔은 어깨보다 낮게 댑니다. 어깨 앞쪽이 찌릿하면 멈춥니다.",calfstretch:"뒤쪽 다리 무릎을 펴고 뒤꿈치를 바닥에 붙입니다."};
function guidePlan(kind){
  var it=plan(week)[dayK],D=it.t==="s"?sesOf(week,dayK,it):{wmin:10},short=D.wmin<10,l=[];
  function g(fig,label,sec,o){o=o||{};l.push({fig:fig,label:label,sec:sec,sub:o.sub||"",hold:o.hold,cue:GCUE[fig]||(CARDIO[fig]&&CARDIO[fig].ng?CARDIO[fig].ng[0]:"")});}
  if(kind==="warm"){
    if(D.out){g("shoulderroll","어깨 작게 돌리기",60,{sub:"앞으로 10회, 뒤로 10회"});g("hipcircle","엉덩이 돌리기",60,{sub:"좌우로 천천히 10회씩"});g("outwalk","밖에서 천천히 걷기",short?120:300,{sub:"몸이 따뜻해질 때까지"});}
    else{
      if(D.home)g("march","제자리 걷기",short?120:300,{sub:"가볍게"});else g(gymNo("bike")?"treadmill":"bike",gymNo("bike")?"트레드밀 걷기":"실내자전거",short?120:300,{sub:"아주 가볍게"});
      g("shoulderroll","어깨 작게 돌리기",short?40:60,{sub:"앞으로 10회, 뒤로 10회"});
      g("catcow","네발 자세 허리 둥글게·평평하게",short?40:75,{sub:"천천히 5회, 통증 없는 범위만"});
      g("hipcircle","엉덩이 돌리기",short?40:60,{sub:"좌우로 천천히 10회씩"});
    }
  }else{
    var rounds=short?1:2;
    for(var r=0;r<rounds;r++){g("hamstring","허벅지 뒤 늘리기 · 왼쪽",30,{hold:1,sub:"수건을 발에 걸고 당기기"+(rounds>1?" ("+(r+1)+"/2)":"")});g("hamstring","허벅지 뒤 늘리기 · 오른쪽",30,{hold:1,sub:"수건을 발에 걸고 당기기"+(rounds>1?" ("+(r+1)+"/2)":"")});}
    g("hipflexor","허벅지 앞 늘리기 · 왼쪽",30,{hold:1,sub:"골반을 앞으로"});g("hipflexor","허벅지 앞 늘리기 · 오른쪽",30,{hold:1,sub:"골반을 앞으로"});
    g("cheststretch","가슴 늘리기 · 왼쪽",20,{hold:1,sub:"팔은 어깨보다 낮게"});g("cheststretch","가슴 늘리기 · 오른쪽",20,{hold:1,sub:"팔은 어깨보다 낮게"});
    g("calfstretch","종아리 늘리기 · 왼쪽",30,{hold:1,sub:"뒤꿈치를 바닥에"});g("calfstretch","종아리 늘리기 · 오른쪽",30,{hold:1,sub:"뒤꿈치를 바닥에"});
  }
  return l;
}
function guideThumbs(kind){
  var seen={},h="";guidePlan(kind).forEach(function(x){if(seen[x.fig])return;seen[x.fig]=1;h+='<figure style="margin:0;width:84px;flex:none">'+pic(x.fig,1)+'<figcaption style="font-size:11px;line-height:1.3;margin-top:3px;color:var(--muted)">'+esc(GNAME[x.fig]||(CARDIO[x.fig]?CARDIO[x.fig].name.split(" (")[0]:x.label))+'</figcaption></figure>';});
  return '<div class="gstrip">'+h+'</div>';
}
function startGuide(kind){
  var l=guidePlan(kind),st=[],tot=0;
  l.forEach(function(x,i){
    st.push({k:"ready",label:"다음: "+x.label,sub:x.sub,dur:i===0?5000:7000,cd:true,say:x.label,fig:x.fig,cue:x.cue,gi:i});
    st.push({k:"cr",label:x.label,sub:x.sub,dur:x.sec*1000,cd:true,fig:x.fig,cue:x.cue,hold:x.hold,gi:i,say:"시작"});
    tot+=x.sec;
  });
  st.push({k:"gdone",dur:0,mark:kind,say:kind==="warm"?"준비운동 완료":"스트레칭 완료"});st.push({k:"end",dur:0});
  runOpen({cardio:true,guide:true,gn:l.length,name:kind==="warm"?"준비운동":"마무리 스트레칭",min:Math.round(tot/60),fig:l[0].fig,cue:l[0].cue},st);
}

function spark(vals,unit){
  var W=320,H=110,p=14,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),lo=mn,hi=mx;if(hi===lo){hi+=1;lo-=1;}
  var pts=vals.map(function(v,i){return[(p+i*(W-2*p)/(vals.length-1)),(p+(hi-v)*(H-2*p)/(hi-lo))];});
  var line=pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  var area="M"+pts[0][0]+","+(H-p)+" L"+line.replace(/ /g," L")+" L"+pts[pts.length-1][0]+","+(H-p)+" Z";
  var e=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+p+'" y2="'+p+'" stroke="var(--line)"/><line x1="'+p+'" x2="'+(W-p)+'" y1="'+(H-p)+'" y2="'+(H-p)+'" stroke="var(--line)"/><path d="'+area+'" fill="var(--accent-soft)"/><polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="4" fill="var(--accent)"/></svg><div class="meta num" style="display:flex;justify-content:space-between"><span>최고 '+mx+unit+'</span><span>최저 '+mn+unit+'</span></div>';
}
function trend(list,key,unit,label){
  var l=list.filter(function(x){return x[key]>0;});
  if(l.length<2)return "";
  var diff=(l[l.length-1][key]-l[0][key]).toFixed(1);
  return '<div class="trend"><p style="margin:12px 0 0"><b>'+label+'</b> 시작 대비 <span class="'+(diff<=0?"down":"up")+' num">'+(diff>0?"+":"")+diff+unit+'</span> <span class="meta">('+l[0].d.slice(5)+" → "+l[l.length-1].d.slice(5)+')</span></p>'+spark(l.map(function(x){return x[key];}),unit)+"</div>";
}

function weekStats(w){
  var PL=plan(w),planned=0,done=0,kc=0;
  ORDER.forEach(function(d){var it=PL[d];if(it.t==="s"){planned++;var pr=dayProgress(w,d,it);if(pr.total&&pr.got===pr.total)done++;kc+=dayKcal(w,d,it).done;}});
  return {planned:planned,done:done,kcal:kc};
}
function streakOf(){
  var cw=curWeek(),n=0,w=cw,s=weekStats(cw);
  if(!(s.planned&&s.done>=s.planned))w=cw-1;
  for(;w>=1;w--){var t=weekStats(w);if(t.planned&&t.done>=t.planned)n++;else break;}
  return n;
}

      for(var r2=1;r2<=A.r;r2++){for(var q=0;q<2;q++){
        st.push({k:"up",label:A.alt[q],dur:2500,big:r2,say:q===0?NUM[r2-1]:"반대",set:i,alt:q===0});
        st.push({k:"down",label:"천천히 돌아오기",dur:2500,big:r2,set:i,alt:q===0});
      }}
      st.push({k:"setdone",dur:0,set:i,say:i<sets-1?"세트 끝, 휴식":"완료"});
      if(i<sets-1)st.push({k:"rest",label:"휴식",dur:S.rest*1000,set:i,cd:true});
      continue;
    }
    for(var s=0;s<sides;s++){
      var side=sides===2?(s===0?"왼쪽":"오른쪽"):"";
      if(s===1)st.push({k:"ready",label:"반대쪽",dur:4000,say:"반대쪽",set:i,side:side,cd:true});
      for(var r=1;r<=A.r;r++){
        if(A.h&&A.r===1){st.push({k:"hold",label:"버티기",dur:A.h*1000,say:"버티기",set:i,side:side,cd:true});}
        else if(A.h){
          st.push({k:"up",label:"올리기",dur:2000,big:r,say:NUM[r-1],set:i,side:side});
          st.push({k:"hold",label:"버티기",dur:A.h*1000,set:i,side:side,cd:true,small:r});
          st.push({k:"down",label:"내리기",dur:2000,big:r,set:i,side:side});
        }else if(inv){
          st.push({k:"down",label:inv.d,dur:dn,big:r,set:i,side:side});
          st.push({k:"up",label:inv.u,dur:up,big:r,say:NUM[r-1],set:i,side:side});
        }else{
          st.push({k:"up",label:(LBL[id]||LBL0).u,dur:up,big:r,say:NUM[r-1],set:i,side:side});
          st.push({k:"down",label:(LBL[id]||LBL0).d,dur:dn,big:r,set:i,side:side});
        }
      }
    }
    st.push({k:"setdone",dur:0,set:i,say:i<sets-1?"세트 끝, 휴식":"완료"});
    if(i<sets-1)st.push({k:"rest",label:"휴식",dur:S.rest*1000,set:i,cd:true});
  }
  st.push({k:"end",dur:0});
  if(A.names)st.forEach(function(x){if(x.side==="왼쪽")x.side=A.names[0];else if(x.side==="오른쪽"){x.side=A.names[1];x.alt=true;}});
  return st;
}
function cardioSteps(kind,min,xw,xwk){
  if((kind==="run"||kind==="outrun")&&min>10){var st=[{k:"cw",label:"걷기로 몸 풀기",sub:"시속 5km 정도",dur:5*60000,say:"걷기로 시작합니다",cd:true},{k:"cr",label:"달리기",sub:phase(week).run,dur:(min-10)*60000,say:"이제 달리기",cd:true},{k:"cw",label:"걷기로 마무리",sub:"천천히 속도를 낮추세요",dur:5*60000,say:"걷기로 마무리합니다",cd:true}];
    if(xw>0)st.push({k:"cw",label:xwk==="bike"?"실내자전거 (칼로리 목표)":xwk==="outwalk"?"빠르게 걷기 (칼로리 목표)":"경사 걷기 (칼로리 목표)",sub:xwk==="bike"?"저항 낮게":xwk==="outwalk"?"숨차지만 대화 가능한 속도":phase(week).walk||"속도 5km/h 전후 · 경사 3~5%",dur:xw*60000,say:xwk==="bike"?"실내자전거로 바꿉니다":"걷기를 이어갑니다",cd:true});
    return st.concat([{k:"cardone",dur:0,say:"유산소 완료"},{k:"end",dur:0}]);}
  return[{k:"cr",label:"유산소",sub:"숨차지만 대화 가능한 강도",dur:min*60000,say:"유산소 시작",cd:true},{k:"cardone",dur:0,say:"유산소 완료"},{k:"end",dur:0}];
}
function fmtT(ms){var s=Math.ceil(ms/1000);return s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):String(s);}
function runOpen(ctx,steps){
  RUN={ctx:ctx,steps:steps,i:-1,end:0,paused:false,lastSec:-1};
  rEl.hidden=false;document.body.style.overflow="hidden";
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){});}catch(e){}
  beep(660,.15);figInit(ctx);runNext();clearInterval(runTimer);runTimer=setInterval(runTick,100);
  if(!figOn){figOn=true;requestAnimationFrame(figLoop);}
}
/* ---------- 시작 화면 가이드 애니메이션 (숫자 세는 박자에 맞춰 움직임) ---------- */
var figLast=0,figOn=false;
function figInit(c){
  var box=document.getElementById("rFig"),cue=document.getElementById("rCue"),mid=box.parentNode,id=c.fig;
  var has=id&&(REALPIC[id]||(window.POSES&&POSES[id]));
  box.hidden=!has;mid.classList.toggle("hasfig",!!has);
  cue.hidden=!c.cue;cue.textContent=c.cue?"⚠ "+c.cue:"";
  if(!has){box.innerHTML="";return;}
  if(AIV[id]){box.className="rfig vid";box.innerHTML='<video id="rVid" src="'+aivSrc(id,AIV[id].loop?"":"sync")+'" muted playsinline preload="auto"'+(AIV[id].loop?' loop':'')+'></video>'+(AIV[id].test?'<span class="tbadge">테스트 · 자세 틀림</span>':'');var rv=document.getElementById("rVid");try{var pp=rv.play();if(pp&&pp.then)pp.then(function(){rv.pause();rv.currentTime=0;}).catch(function(){});}catch(e){}return;}
  if(REALPIC[id]){box.className="rfig real";box.innerHTML='<img src="img/ex/'+id+'-1.svg" alt=""><img id="rFig2" src="img/ex/'+id+'-2.svg" alt="" style="opacity:0">';}
  else{box.className="rfig"+(window.POSE3&&POSE3[id]?" two":"");box.innerHTML='<svg viewBox="0 0 200 140" aria-hidden="true">'+figBody(id,0)+'</svg>'+(window.POSE3&&POSE3[id]?'<div class="inset"><svg viewBox="0 0 200 140" aria-hidden="true">'+fig3Body(id,POSE3[id].views[0],0)+'</svg></div>':"");}
}
function figPos(now){
  var s=RUN.steps[RUN.i];if(!s)return 0;
  var e=function(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);};
  if(RUN.ctx.cardio){if(s.k!=="cr"&&s.k!=="cw")return 0;if(s.hold)return e((s.dur-(RUN.end-Date.now()))/2500);return figT(s.fig||RUN.ctx.fig,now);}
  var p=s.dur?1-(RUN.end-Date.now())/s.dur:1;
  if(RUN.paused)p=RUN.pp===undefined?p:RUN.pp;
  var inv=window.POSES&&POSES[RUN.ctx.fig]&&POSES[RUN.ctx.fig].inv;
  if(s.k==="up")return inv?1-e(p):e(p);
  if(s.k==="down")return inv?e(p):1-e(p);
  if(s.k==="hold")return 1;
  return 0;
}
function figLoop(now){
  if(!RUN||rEl.hidden){figOn=false;return;}
  requestAnimationFrame(figLoop);
  if(RUN.paused){var pv=document.getElementById("rVid");if(pv&&!pv.paused)pv.pause();}
  if(now-figLast<33||RUN.paused)return;figLast=now;
  var cs=RUN.steps[RUN.i],id=(cs&&cs.fig)||RUN.ctx.fig;if(!id)return;
  var t=figPos(now);
  if(AIV[id]&&AIV[id].loop){var lv=document.getElementById("rVid");if(lv){var on=cs&&(cs.k==="cr"||cs.k==="cw");var wk=(cs&&cs.k==="cw"&&AIV[id].walk&&AIV[AIV[id].walk])?AIV[id].walk:id;if((lv.getAttribute("data-cur")||id)!==wk){lv.setAttribute("data-cur",wk);lv.src=aivSrc(wk,"");lv.load();}if(on&&lv.paused){try{var lp=lv.play();if(lp&&lp.catch)lp.catch(function(){});}catch(e){}}else if(!on&&!lv.paused){lv.pause();lv.currentTime=0;}}}
  else if(AIV[id]){var v=document.getElementById("rVid");if(v&&v.duration){var tt=Math.max(0,Math.min(v.duration-0.05,t*v.duration));if(Math.abs(v.currentTime-tt)>0.02)v.currentTime=tt;var cst=RUN.steps[RUN.i],fl=AIV[id].flip!==undefined?!!(cst&&cst.alt!==undefined&&!!cst.alt===AIV[id].flip):!!(AIV[id].side&&cst&&((cst.label||"")+"|"+(cst.side||"")).indexOf(AIV[id].side==="L"?"오른쪽":"왼쪽")>=0);v.style.transform=fl?"scaleX(-1)":"";}}
  else if(REALPIC[id]){var f=document.getElementById("rFig2");if(f)f.style.opacity=t.toFixed(2);}
  else if(window.POSES&&POSES[id]){var sv=document.querySelector("#rFig svg"),st=RUN.steps[RUN.i];if(sv)sv.innerHTML=figBody(id,t,st&&st.alt);
    var iv=document.querySelector("#rFig .inset svg");if(iv&&window.POSE3&&POSE3[id])iv.innerHTML=fig3Body(id,POSE3[id].views[0],t,st&&st.alt);}
}
function runNext(){
  if(!RUN)return;
  RUN.i++;var s=RUN.steps[RUN.i];
  if(!s||s.k==="end"){runFinish();return;}
  if(s.k==="setdone"){var k=dk(week,dayK);S.sets[k]=S.sets[k]||{};var a=S.sets[k][RUN.ctx.id]||[];a[s.set]=true;S.sets[k][RUN.ctx.id]=a;save();}
  if(s.k==="cardone"){var k2=dk(week,dayK);S.done[k2]=S.done[k2]||{};S.done[k2].cardio=true;save();}
  if(s.k==="gdone"){var k3=dk(week,dayK);S.done[k3]=S.done[k3]||{};S.done[k3][s.mark]=true;save();}
  if(RUN.ctx.guide&&s.fig&&s.fig!==RUN.curFig){RUN.curFig=s.fig;figInit({fig:s.fig,cue:s.cue});}
  if(s.say)say(s.say);
  if(s.k==="up"&&!S.voice)beep(880,.12);
  RUN.end=Date.now()+s.dur;RUN.lastSec=-1;
  if(s.dur===0){runNext();return;}
  runDraw();
}
function runTick(){
  if(!RUN||RUN.paused)return;
  var s=RUN.steps[RUN.i];if(!s)return;
  var rem=RUN.end-Date.now();
  if(rem<=0){runNext();return;}
  if(s.cd){var sec=Math.ceil(rem/1000);if(sec!==RUN.lastSec){RUN.lastSec=sec;if((s.k==="rest"||s.k==="ready")&&sec<=3)beep(sec===1?1040:880,.12);if((s.k==="cr"||s.k==="cw")&&sec===300&&s.dur>600000)say("5분 남았습니다");}}
  runDraw(rem);
}
function runDraw(rem){
  var s=RUN.steps[RUN.i];if(!s)return;
  if(rem===undefined)rem=RUN.end-Date.now();
  var c=RUN.ctx,tot=c.sets;
  document.getElementById("rName").textContent=c.name;
  document.getElementById("rSet").textContent=c.guide?((s.gi+1)+" / "+c.gn+" 동작"):c.cardio?(c.min+"분 유산소"):((s.set+1)+" / "+tot+"세트"+(s.side?" · "+s.side:"")+(c.reps?" · 목표 "+c.reps:""));
  document.getElementById("rLabel").textContent=s.label||"";
  document.getElementById("rSub").textContent=s.sub||(s.k==="rest"?"물 한 모금 마시고 숨 고르기":(s.small?s.small+"회째":""));
  document.getElementById("rBig").textContent=s.cd?fmtT(rem):String(s.big||"");
  document.getElementById("rBig").className="rbig num k-"+s.k;
  document.getElementById("rBar").style.width=Math.max(0,Math.min(100,100-rem/s.dur*100))+"%";
  document.getElementById("rPause").textContent=RUN.paused?"계속":"일시정지";
  document.getElementById("rSetEnd").hidden=!!c.cardio;
  document.getElementById("rNextEx").hidden=true;
}
function runFinish(){
  clearInterval(runTimer);
  var c=RUN.ctx;
  document.getElementById("rLabel").textContent=c.guide?c.name+" 완료":c.cardio?"유산소 완료":"모든 세트 완료";
  document.getElementById("rSub").textContent="수고하셨습니다";
  document.getElementById("rBig").textContent="✓";document.getElementById("rBig").className="rbig k-done";
  document.getElementById("rBar").style.width="100%";
  document.getElementById("rSetEnd").hidden=true;
  var nx=c.next?document.getElementById("rNextEx"):null;
  if(nx){nx.hidden=false;nx.textContent="다음: "+c.nextName+" ▶";}
  RUN.done=true;
}
function runClose(){
  clearInterval(runTimer);RUN=null;rEl.hidden=true;document.body.style.overflow="";
  try{speechSynthesis.cancel();}catch(e){}
  try{if(wake)wake.release();}catch(e){}wake=null;
  keepScroll(function(){renderDay();renderTop();});
}
function startEx(id){
  var it=plan(week)[dayK];if(!it||it.t!=="s")return;
  var D=sesOf(week,dayK,it),P={sets:D.sets},a=setsOf(week,dayK,id),from=0;
  while(from<P.sets&&a[from])from++;
  if(from>=P.sets)from=0;
  var idx=D.ex.indexOf(id),nextId=null;
  for(var j=idx+1;j<D.ex.length;j++){var b=setsOf(week,dayK,D.ex[j]),all=true;for(var q=0;q<P.sets;q++)if(!b[q])all=false;if(!all){nextId=D.ex[j];break;}}
  var E=EX[id];
  runOpen({id:id,fig:gymNo(id)?null:id,cue:!gymNo(id)&&EX[id].ng?EX[id].ng[0]:"",name:gymNo(id)?altName(id):exName(id),sets:P.sets,reps:repsOf(id),next:nextId,nextName:nextId?(gymNo(nextId)?altName(nextId):exName(nextId)):""},buildSteps(id,P.sets,from));
}
function startCardio(){
  var it=plan(week)[dayK],P=phase(week),kind,min,name;
  var xw=0,xwk="";if(it.t==="s"){var D=sesOf(week,dayK,it);kind=D.c;min=cminOf(D,P);xw=D.xw||0;xwk=D.xwk||"";name=gymNo(kind)?altName(kind):CARDIO[kind].name;}
  else{kind=PRG&&PRG.canRun?"run":"treadmill";min=PRG?PRG.cB[0]:30;name=kind==="run"?"러닝 또는 빠르게 걷기":"경사 걷기";}
  runOpen({cardio:true,name:name,min:min,fig:gymNo(kind)?null:kind,cue:!gymNo(kind)&&CARDIO[kind]&&CARDIO[kind].ng?CARDIO[kind].ng[0]:""},cardioSteps(kind,min,xw,xwk));
}
document.getElementById("rPause").onclick=function(){if(!RUN||RUN.done)return;if(RUN.paused){RUN.end=Date.now()+RUN.rem;RUN.paused=false;}else{RUN.rem=RUN.end-Date.now();RUN.paused=true;try{speechSynthesis.cancel();}catch(e){}}runDraw(RUN.paused?RUN.rem:undefined);};
document.getElementById("rSetEnd").onclick=function(){if(!RUN||RUN.done)return;RUN.paused=false;for(var j=RUN.i;j<RUN.steps.length;j++){if(RUN.steps[j].k==="setdone"){RUN.i=j-1;runNext();return;}}};
document.getElementById("rSkip").onclick=function(){if(!RUN||RUN.done)return;RUN.paused=false;runNext();};
document.getElementById("rClose").onclick=runClose;
document.getElementById("rNextEx").onclick=function(){var n=RUN&&RUN.ctx.next;clearInterval(runTimer);RUN=null;if(n)startEx(n);};
document.getElementById("rVoice").onclick=function(){S.voice=!S.voice;save();this.setAttribute("aria-pressed",S.voice);this.textContent=S.voice?"음성 켜짐":"음성 꺼짐 (삐 소리)";};
document.getElementById("rTempo").onclick=function(){S.tempo=S.tempo==="fast"?"normal":"fast";save();this.textContent=S.tempo==="fast"?"속도: 빠르게 (1회 3초)":"속도: 보통 (1회 4초)";};
document.getElementById("rRest").onclick=function(){S.rest=S.rest===60?90:60;save();this.textContent="휴식 "+S.rest+"초";};
function syncRunLabels(){document.getElementById("rVoice").textContent=S.voice?"음성 켜짐":"음성 꺼짐 (삐 소리)";document.getElementById("rVoice").setAttribute("aria-pressed",S.voice);
document.getElementById("rTempo").textContent=S.tempo==="fast"?"속도: 빠르게 (1회 3초)":"속도: 보통 (1회 4초)";
document.getElementById("rRest").textContent="휴식 "+S.rest+"초";}
syncRunLabels();

renderAll();boot();checkUpdate();
})();
</script>
